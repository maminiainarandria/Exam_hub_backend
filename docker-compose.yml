services:
  postgres:
    image: postgres:16-alpine
    container_name: exam-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam_hub
      POSTGRES_USER: exam_hub
      POSTGRES_PASSWORD: exam_hub_password
    ports:
      - "5433:5432"
    volumes:
      - exam_hub_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_hub -d exam_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exam_hub_pgdata:
